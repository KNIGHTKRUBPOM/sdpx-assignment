services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: paireval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - paireval-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paireval"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      target: dependencies
    working_dir: /app
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./drizzle:/app/drizzle:ro
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/paireval
    command: ["npx", "tsx", "scripts/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/paireval
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      INITIAL_OWNER_EMAILS: ${INITIAL_OWNER_EMAILS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  paireval-data:
