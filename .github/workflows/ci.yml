name: CI
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets (redacted output)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run lint:spec
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx tsx scripts/test-database.ts integration
      - name: Restricted database role and encrypted restore drill
        run: npx tsx scripts/test-database.ts ops
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/test-database.ts e2e --repeat-each=3
      - name: Performance gate (30 concurrent users, isolated PostgreSQL)
        run: npx tsx scripts/test-database.ts perf
      - name: Isolated demo login and full classroom lifecycle
        run: npm run test:demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-evidence-${{ github.sha }}
          path: |
            coverage/
            playwright-report/
            test-results/
            performance/results/
          retention-days: 14
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t paireval:${{ github.sha }} .
  deploy:
    needs: [verify, container]
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://paireval-pilot.vercel.app
    permissions:
      contents: read
      actions: read
    concurrency:
      group: paireval-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install pinned deployment CLI without application secrets
        run: npm install --prefix "$RUNNER_TEMP/paireval-vercel" --no-audit --no-fund --ignore-scripts vercel@64.0.2
      - name: Verify configuration, stage production, smoke test and promote
        run: node scripts/release-production.mjs
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERCEL_CLI_PATH: ${{ runner.temp }}/paireval-vercel/node_modules/vercel/dist/index.js
