name: CI
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets (redacted output)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run lint:spec
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx tsx scripts/test-database.ts integration
      - name: Restricted database role and encrypted restore drill
        run: npx tsx scripts/test-database.ts ops
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/test-database.ts e2e --repeat-each=3
      - name: Performance gate (30 concurrent users, isolated PostgreSQL)
        run: npx tsx scripts/test-database.ts perf
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-evidence-${{ github.sha }}
          path: |
            coverage/
            playwright-report/
            test-results/
            performance/results/
          retention-days: 14
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t paireval:${{ github.sha }} .
  deploy:
    needs: [verify, container]
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      # Use a separate Vercel project per GitHub environment, each with its own DB/OAuth callback.
      - name: Deploy the verified commit
        run: npx --yes vercel@64.0.2 deploy --prod --yes
