                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "classroomId",
                  "name",
                  "opensAt",
                  "closesAt",
                  "config",
                  "criteria"
                ],
                "properties": {
                  "classroomId": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "opensAt": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "closesAt": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "config": {
                    "type": "object",
                    "description": "Weights sum to 100% separately for each side. Defaults: floor=.6, ceiling=1, threshold=.9, group=15, individual=5.",
                    "properties": {
                      "floor": {
                        "type": "number"
                      },
                      "ceiling": {
                        "type": "number"
                      },
                      "instructorWeight": {
                        "type": "number"
                      },
                      "completionThreshold": {
                        "type": "number"
                      },
                      "groupMaxScore": {
                        "type": "number"
                      },
                      "individualMaxScore": {
                        "type": "number"
                      },
                      "minComparisons": {
                        "type": "number"
                      },
                      "targetCoverage": {
                        "type": "number"
                      },
                      "maxWorkload": {
                        "type": "number"
                      }
                    }
                  },
                  "criteria": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 10,
                    "items": {
                      "type": "object",
                      "required": [
                        "id",
                        "name",
                        "side",
                        "weightPct"
                      ],
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "side": {
                          "type": "string",
                          "enum": [
                            "GROUP",
                            "INDIVIDUAL"
                          ]
                        },
                        "weightPct": {
                          "type": "number",
                          "exclusiveMinimum": 0,
                          "maximum": 100
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
